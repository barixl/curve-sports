{% extends 'base.html' %}
{% block title %}Reset Password — Curve Sports{% endblock %}

{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 20px">
  <div style="width:100%;max-width:440px">
    <div style="text-align:center;margin-bottom:32px">
      <h2 style="font-size:22px;font-weight:600;color:var(--text)">Reset Password</h2>
      <p style="color:var(--text-3);font-size:14px">Enter the OTP sent to <strong>{{ email }}</strong> and your new password.</p>
    </div>

    <div style="background:white;border-radius:16px;padding:36px;box-shadow:var(--shadow-lg)">
      <form method="post">
        <div class="form-group" style="margin-bottom:20px">
          <label style="font-size:13px;font-weight:700;color:var(--text-2);display:block;margin-bottom:7px">6-digit OTP</label>
          <input type="text" name="otp" required maxlength="6" pattern="\d{6}"
                 style="width:100%;padding:12px;border:2px solid var(--border);border-radius:10px;font-size:18px;text-align:center;transition:border-color 0.2s"
                 placeholder="000000"
                 onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border)'">
        </div>

        <div class="form-group" style="margin-bottom:20px">
          <label style="font-size:13px;font-weight:700;color:var(--text-2);display:block;margin-bottom:7px">New Password</label>
          <input type="password" name="password" required
                 style="width:100%;padding:12px;border:2px solid var(--border);border-radius:10px;font-size:15px;transition:border-color 0.2s"
                 placeholder="Enter new password"
                 onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border)'">
        </div>

        <div class="form-group" style="margin-bottom:24px">
          <label style="font-size:13px;font-weight:700;color:var(--text-2);display:block;margin-bottom:7px">Confirm Password</label>
          <input type="password" name="confirm_password" required
                 style="width:100%;padding:12px;border:2px solid var(--border);border-radius:10px;font-size:15px;transition:border-color 0.2s"
                 placeholder="Confirm new password"
                 onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border)'">
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding:14px;font-size:16px">
          Reset Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

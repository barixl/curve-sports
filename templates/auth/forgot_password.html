{% extends 'base.html' %}
{% block title %}Forgot Password — Curve Sports{% endblock %}

{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 20px">
  <div style="width:100%;max-width:440px">
    <div style="text-align:center;margin-bottom:32px">
      <h2 style="font-size:22px;font-weight:600;color:var(--text)">Forgot Password?</h2>
      <p style="color:var(--text-3);font-size:14px">Enter your email and we'll send you an OTP to reset your password.</p>
    </div>

    <div style="background:white;border-radius:16px;padding:36px;box-shadow:var(--shadow-lg)">
      <form method="post">
        <div class="form-group" style="margin-bottom:20px">
          <label style="font-size:13px;font-weight:700;color:var(--text-2);display:block;margin-bottom:7px">Email Address</label>
          <div style="position:relative">
            <i class="fas fa-envelope" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3)"></i>
            <input type="email" name="email" required autofocus
                   style="width:100%;padding:12px 14px 12px 40px;border:2px solid var(--border);border-radius:10px;font-size:15px;transition:border-color 0.2s"
                   placeholder="you@example.com"
                   onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border)'">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding:14px;font-size:16px">
          Send Reset OTP
        </button>
      </form>

      <div style="text-align:center;margin-top:24px;padding-top:24px;border-top:1px solid var(--border)">
        <a href="{{ url_for('auth.login') }}" style="font-size:14px;color:var(--primary);font-weight:700">Back to Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
